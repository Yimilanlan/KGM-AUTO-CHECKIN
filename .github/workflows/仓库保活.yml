name: 仓库保活

on:
  schedule:
    # 每月 1 号 00:00 UTC（北京时间 08:00）运行一次，避免仓库未更新导致 Actions 被禁用
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 更新保活时间戳
        run: |
          mkdir -p .github
          {
            echo "# Repository Keepalive"
            echo ""
            echo "This file is automatically updated to keep the repository active."
            echo ""
            echo "**Last Update:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "**Workflow Run:** #${{ github.run_number }}"
            echo "**Trigger:** ${{ github.event_name }}"
            echo ""
            echo "---"
            echo ""
            echo "*Auto-generated by [仓库保活 workflow](.github/workflows/仓库保活.yml)*"
          } > .github/KEEPALIVE.md

      - name: 提交并推送
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .github/KEEPALIVE.md

          if git diff --staged --quiet; then
            echo "无变更"
          else
            git commit -m "chore: keepalive at $(date -u +'%Y-%m-%d')"
            git push
            echo "保活提交成功"
          fi
